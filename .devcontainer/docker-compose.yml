services:
  test-data-factory-app:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.app
      target: development
    user: developer
    command: sleep infinity
    env_file:
      - ../.env
    environment:
      NEO4J_URL: bolt://test-data-factory-graph:7687
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspaces/test-data-factory
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: input
    volumes:
      - ..:/workspaces/test-data-factory:cached
    working_dir: /workspaces/test-data-factory
    depends_on:
      test-data-factory-graph:
        condition: service_healthy

  test-data-factory-graph:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.graph
    ports:
      - "7474:7474"
      - "7687:7687"
    env_file:
      - ../.env
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    entrypoint:
      - /bin/sh
      - -c
      - |
        export NEO4J_AUTH="$${NEO4J_USERNAME}/$${NEO4J_PASSWORD}"
        export NEO4J_initial_dbms_default__database="$${NEO4J_DATABASE}"
        unset NEO4J_USERNAME NEO4J_PASSWORD NEO4J_DATABASE NEO4J_URL
        exec /startup/docker-entrypoint.sh neo4j
    healthcheck:
      # Bolt port open means the server accepts connections; uses only the image's shell.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7687' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    tmpfs:
      - /data
